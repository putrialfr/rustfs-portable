name: Build RustFS portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout RustFS alpha.83
        run: |
          git clone --depth 1 --branch 1.0.0-alpha.83 \
            https://github.com/rustfs/rustfs.git rustfs-src

      - name: Build static MUSL binary
        run: |
          docker run --rm \
            -v "$PWD/rustfs-src:/src" \
            -w /src \
            rust:1.85-bookworm \
            bash -c '
              set -e

              apt-get update
              apt-get install -y \
                musl-tools \
                protobuf-compiler \
                flatbuffers-compiler \
                pkg-config \
                libssl-dev \
                build-essential

              rustup target add x86_64-unknown-linux-musl

              ./scripts/static.sh

              cargo run --bin gproto

              export RUSTFLAGS="-C target-cpu=x86-64"

              cargo build \
                --release \
                --locked \
                --target x86_64-unknown-linux-musl \
                --bin rustfs \
                -j "$(nproc)"

              mkdir -p /src/output

              cp \
                target/x86_64-unknown-linux-musl/release/rustfs \
                /src/output/rustfs

              chmod +x /src/output/rustfs
            '

      - name: Verify binary
        run: |
          file rustfs-src/output/rustfs
          strings rustfs-src/output/rustfs | grep -E 'GLIBC_[0-9.]+' || true

      - name: Create Docker image
        run: |
          cat > Dockerfile.portable <<'EOF'
          FROM ubuntu:22.04

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                ca-certificates \
                curl \
                tzdata && \
              rm -rf /var/lib/apt/lists/*

          RUN groupadd -g 10001 rustfs && \
              useradd -u 10001 -g rustfs -M -s /usr/sbin/nologin rustfs

          RUN mkdir -p /data /logs && \
              chown -R rustfs:rustfs /data /logs

          COPY rustfs-src/output/rustfs /usr/bin/rustfs

          RUN chmod +x /usr/bin/rustfs

          ENV RUSTFS_VOLUMES=/data
          ENV RUSTFS_ADDRESS=0.0.0.0:9000
          ENV RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
          ENV RUSTFS_CONSOLE_ENABLE=true

          EXPOSE 9000 9001

          VOLUME ["/data"]

          USER rustfs

          CMD ["/usr/bin/rustfs", "/data"]
          EOF

          docker build \
            -f Dockerfile.portable \
            -t rustfs/rustfs:1.0.0-alpha.83 \
            .

      - name: Test image
        run: |
          docker run --rm \
            --entrypoint /usr/bin/rustfs \
            rustfs/rustfs:1.0.0-alpha.83 \
            --version

      - name: Export image
        run: |
          docker save rustfs/rustfs:1.0.0-alpha.83 \
            | gzip > rustfs-portable.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustfs-portable-musl
          path: rustfs-portable.tar.gz
          retention-days: 3
